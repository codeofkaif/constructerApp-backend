spring.application.name=constructerApp

# Server Port Binding (Render uses dynamic PORT)
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adil_construction}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Batch insert optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20

# JWT Configuration
jwt.secret=${JWT_SECRET:gsdyfjyssgfkukyfchghhgdskuyfiubljhlkjhlvvhhhg}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Bootstrap Admin Credentials
admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Super Admin}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@constructer.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@1234}
admin.bootstrap.phone=${ADMIN_BOOTSTRAP_PHONE:9999999999}

# Email Configuration (Gmail SMTP Alert)
