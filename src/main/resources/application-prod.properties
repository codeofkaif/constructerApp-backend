spring.application.name=constructerApp

# Production Server Port Binding
server.port=${PORT:8080}

# Production PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Production Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Batch insert optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Bootstrap Admin Credentials
admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Super Admin}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@constructer.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@1234}
admin.bootstrap.phone=${ADMIN_BOOTSTRAP_PHONE:9999999999}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Notification Recipient Email
admin.notification.email=${ADMIN_NOTIFICATION_EMAIL}

# Allowed CORS Origins (Set in Render Dashboard: e.g. https://your-app.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
